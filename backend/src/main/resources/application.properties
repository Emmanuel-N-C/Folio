# Application Name
spring.application.name=folio-backend

# Server Port
server.port=${PORT:8081}

# PostgreSQL - Uses environment variables
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:folio_db}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# AWS S3 Configuration
aws.access.key.id=${AWS_ACCESS_KEY_ID}
aws.secret.access.key=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
cors.max-age=${CORS_MAX_AGE:3600}

# WebSocket Configuration
websocket.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}

# SendGrid Email Configuration
sendgrid.api-key=${SENDGRID_API_KEY}
mail.from.email=${MAIL_FROM_EMAIL}
mail.from.name=${MAIL_FROM_NAME}

# Frontend URL for email links
frontend.url=${FRONTEND_URL:http://localhost:5173}

# OAuth2 Configuration
oauth.google.client-id=${GOOGLE_CLIENT_ID}
oauth.github.client-id=${GITHUB_CLIENT_ID}
oauth.github.client-secret=${GITHUB_CLIENT_SECRET}

# OAuth Frontend Success/Failure URLs
oauth.frontend.success.url=${OAUTH_FRONTEND_SUCCESS_URL:http://localhost:5173/auth/oauth/callback}
oauth.frontend.failure.url=${OAUTH_FRONTEND_FAILURE_URL:http://localhost:5173/auth/oauth/error}



# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.folio=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# WebSocket Logging
logging.level.com.folio.folio_backend.websocket=WARN